# DO NOT USE IN PRODUCTION — test only
services:
  test:
    build:
      context: .
      target: backend-e2e-deps
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
      - .:/repo:ro
    environment:
      REPO_ROOT: /repo
    env_file:
      - .env.test
    command: /app/run_tests.sh
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env.test
    # NO named volume — ephemeral, destroyed on `down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kendo_test -d kendo_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
