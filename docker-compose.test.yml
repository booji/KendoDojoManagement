# DO NOT USE IN PRODUCTION — test only
# See docker-compose.yml for why this is set explicitly (#274).
name: kendodojo-test

services:
  test:
    build:
      context: .
      target: backend-e2e-deps
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
      - .:/repo:ro
    environment:
      TZ: Europe/London
      REPO_ROOT: /repo
    env_file:
      - .env.test
    command: /app/run_tests.sh
    depends_on:
      db:
        condition: service_healthy

  # The fast half of the suite (#336): same script, same per-run throwaway
  # database, but BACKEND_ONLY=1 skips the frontend install, Vite and the e2e
  # files — and the lighter build target skips Node and Playwright's chromium
  # download entirely. CI runs this on every push; the full `test` service
  # above stays on release candidates.
  test-backend:
    build:
      context: .
      target: backend-dev-deps
    volumes:
      - ./backend:/app
      - .:/repo:ro
    environment:
      TZ: Europe/London
      REPO_ROOT: /repo
      BACKEND_ONLY: "1"
    env_file:
      - .env.test
    command: /app/run_tests.sh
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      TZ: Europe/London
    env_file:
      - .env.test
    # NO named volume — ephemeral, destroyed on `down`
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kendo_test -d kendo_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
