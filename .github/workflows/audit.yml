name: Dependency audit

# Known vulnerabilities in what the prod image ships (#457): the backend's
# runtime requirements and the frontend's non-dev packages. A finding fails
# the run; nothing gates on it, so a fresh advisory in a transitive dependency
# never blocks an urgent release. Dependabot opens the upgrade PRs.
on:
  push:
    branches:
      - '**'
    paths:
      - 'backend/uv.lock'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/audit.yml'
  # Advisories are published without a push to this repo.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pip-audit and npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: pip-audit (backend runtime dependencies)
        # The locked runtime set the prod image installs (Dockerfile:
        # `uv sync --no-default-groups`), without the dev and docs groups.
        # Fully pinned, so pip-audit needs no resolver (--no-deps --disable-pip).
        # `uv audit` would do this in one step but is experimental and, in
        # 0.11.7, audits every group regardless of --no-default-groups.
        # ponytail: pip-audit pinned here, so Dependabot does not bump it; move
        # it into a dependency group if it falls behind.
        working-directory: backend
        run: |
          uv export --frozen --no-default-groups --no-hashes --no-emit-project \
            -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --no-deps --disable-pip -r "$RUNNER_TEMP/requirements.txt"

      - name: npm audit (frontend, production dependencies)
        # Still runs after a pip-audit finding, so one run reports both.
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --omit=dev
