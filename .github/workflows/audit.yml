name: Dependency audit

# Known vulnerabilities in what the prod image ships (#457): the backend's
# runtime requirements and the frontend's non-dev packages. A finding fails
# the run; nothing gates on it, so a fresh advisory in a transitive dependency
# never blocks an urgent release. Dependabot opens the upgrade PRs.
on:
  push:
    branches:
      - '**'
    paths:
      - 'backend/requirements.txt'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/audit.yml'
  # Advisories are published without a push to this repo.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: pip-audit and npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image's Python (Dockerfile `FROM python:3.13-slim`), so environment
      # markers resolve as they do there. Bump the two together.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: pip-audit (backend runtime requirements)
        # ponytail: version pinned here, so Dependabot does not bump it; move
        # it into a requirements file if it falls behind.
        run: pipx run pip-audit==2.10.1 -r backend/requirements.txt

      - name: npm audit (frontend, production dependencies)
        # Still runs after a pip-audit finding, so one run reports both.
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm audit --omit=dev
