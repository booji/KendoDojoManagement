name: Docs

# The docs site (#415): mkdocs.yml, served on GitHub Pages from the gh-pages
# branch, one version per major image tag via mike — an operator on the :1
# image reads the 1.x docs. A pull request only builds, strictly, so a broken
# link fails in the same PR as the change that broke it. `main` publishes `dev`;
# a release tag publishes its major and moves `latest` to it.
on:
  pull_request:
    paths: &docs
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
      # Included into pages by pymdownx.snippets.
      - 'README.md'
      - 'UBIQUITOUS_LANGUAGE.md'
      - 'CLAUDE.md'
      - '.env.example'
      - 'deploy/env/**'
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes: every release tag deploys.
    paths: *docs
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  deploy:
    name: Publish with mike
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One writer to gh-pages across every ref: a merge to main and the release
    # tag pushed straight after it would otherwise both push, and the second
    # is rejected as non-fast-forward. Never cancel one half-way through.
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    # mike commits the built version to gh-pages and pushes it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt

      # The docs version on the image tag's axis (ADR-0004): v1.4.0 -> 1.x.
      # A release candidate's image gets only its exact tag and never :1, so
      # its docs publish nowhere either — empty skips the deploy.
      - id: version
        run: |
          case $GITHUB_REF in
            refs/heads/main) version=dev ;;
            refs/tags/v*-*)  version= ;;
            refs/tags/v*)    version=${GITHUB_REF#refs/tags/v}; version=${version%%.*}.x ;;
            *)               version= ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # mike works on a local gh-pages; absent on the very first publish.
          git fetch origin gh-pages:gh-pages || true
          if [ "$VERSION" = dev ]; then
            mike deploy --push dev
            # Until the first release there is no `latest` for the site root
            # to land on; point it at dev rather than a 404.
            mike list latest >/dev/null 2>&1 || mike set-default --push dev
          else
            # ponytail: `latest` follows the most recent release tag, so a
            # backport tagged on an older major after a newer one moves it
            # back; compare against `mike list` if that ever happens.
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          fi
