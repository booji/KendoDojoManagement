name: Backend tests

# The full suite (see tests.yml) is ~15 minutes, almost all of it Playwright,
# and this repository is private so Actions minutes are metered. This is the
# fast half — no frontend install, no Vite, no browsers — cheap enough to run
# on every push, which is where most regressions are caught. It is advisory:
# no branch protection depends on it (#336).
on:
  push:
    # Branches only. Without this, a `v*-rc*` tag push would fire this job as
    # well as the full suite in tests.yml and bill for both.
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Least privilege: the suite only ever needs to read the checked-out tree.
permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend suite (pytest, no e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Lint and format check (ruff)
        # The ruff version comes from requirements-dev.txt, so CI and the
        # local venv cannot drift apart.
        working-directory: backend
        run: |
          spec="$(grep '^ruff==' requirements-dev.txt)"
          pipx run --spec "$spec" ruff check .
          pipx run --spec "$spec" ruff format --check .

      - name: Run the backend tests
        # The test-backend service builds the backend-dev-deps stage and runs
        # backend/run_tests.sh with BACKEND_ONLY=1: uvicorn still comes up (a
        # few non-e2e tests drive :8000), but the Playwright files are not
        # collected and no browser is ever installed.
        #
        # The wall-clock convergence assertions are excluded here and run in
        # the reporting step below. Everything else, including the synthetic
        # fixtures in test_timing_convergence.py, still gates this job.
        run: >-
          docker compose -f docker-compose.test.yml run --rm
          -e PYTEST_MARK="not timing_sensitive" test-backend

      - name: Report the timing-sensitive assertions (advisory)
        # These measure real latency, so their outcome depends on the machine
        # underneath them, and a hosted runner is not a machine we control.
        # They have painted unrelated PRs red repeatedly (#364, and again after
        # the confirmation round shipped in #366), which trains people to
        # re-run without reading -- exactly how a real regression gets waved
        # through.
        #
        # So this step reports rather than gates: the numbers stay visible in
        # the log for anyone investigating, while the strict assertion is kept
        # where a human is already reading output -- a local run, and the full
        # suite on release-candidate tags (tests.yml), which does NOT exclude
        # them.
        #
        # If this step fails on a run whose same-path control is NOT unusually
        # quiet, that is worth investigating rather than dismissing: see
        # docs/auth-timing-calibration.md.
        continue-on-error: true
        run: >-
          docker compose -f docker-compose.test.yml run --rm
          -e PYTEST_MARK="timing_sensitive" test-backend

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
