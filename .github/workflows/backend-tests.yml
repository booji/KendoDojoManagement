name: Backend tests

# The full suite (see tests.yml) is ~15 minutes, almost all of it Playwright,
# and this repository is private so Actions minutes are metered. This is the
# fast half — no frontend install, no Vite, no browsers — cheap enough to run
# on every push, which is where most regressions are caught. It is advisory:
# no branch protection depends on it (#336).
on:
  push:
    # Branches only. Without this, a `v*-rc*` tag push would fire this job as
    # well as the full suite in tests.yml and bill for both.
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# Least privilege: the suite only ever needs to read the checked-out tree.
permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend suite (pytest, no e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Run the backend tests
        # The test-backend service builds the backend-dev-deps stage and runs
        # backend/run_tests.sh with BACKEND_ONLY=1: uvicorn still comes up (a
        # few non-e2e tests drive :8000), but the Playwright files are not
        # collected and no browser is ever installed.
        run: docker compose -f docker-compose.test.yml run --rm test-backend

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
