name: Release image

# Tagged releases publish the `prod` stage to GHCR so an operator never builds
# (ADR-0004). The image carries its own deployment bundle — `podman run --rm
# <image> init | tar -x` — so the config and the app it configures ship on one
# version axis.
on:
  push:
    tags:
      - 'v*'

# Least privilege: read the tree, write the package, and mint the OIDC token
# cosign signs with. Nothing else.
permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push ghcr.io/booji/kendodojomanagement
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Release candidates (v1.0.0-rc1) are prereleases: they get their exact
      # tag so the clean-VPS rehearsal has something to pull, but never the
      # moving 1 / 1.0 / latest tags an operator is pinned to.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/booji/kendodojomanagement
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The pin setup.sh writes into .env: the MAJOR tag for a release, since
      # that is what upgrades unattended (ADR-0004), but the exact tag for a
      # prerelease — an rc rehearsal must stay on the image it is rehearsing.
      - id: pin
        run: |
          v='${{ steps.meta.outputs.version }}'
          case "$v" in *-*) tag="$v" ;; *) tag="${v%%.*}" ;; esac
          echo "ref=ghcr.io/booji/kendodojomanagement:$tag" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prod
          push: true
          build-args: |
            KENDO_IMAGE_REF=${{ steps.pin.outputs.ref }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Keyless signature of the pushed digest (#457), so a host can check an
      # image came from this workflow. The identity is the workflow's OIDC
      # token, recorded in the public Sigstore log; there is no key to steal.
      # Signing the digest covers every tag on it. cosign v2 writes the
      # classic signature tag that Podman's policy.json sigstoreSigned check
      # reads; v3 (cosign-installer v4) defaults to a different format.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/booji/kendodojomanagement@$DIGEST"
