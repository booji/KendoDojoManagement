name: Tests

# The full suite is ~15 minutes, almost all Playwright, so it runs where a
# release is cut rather than on every push: release candidates, and PRs into
# main (release and hotfix branches under git-flow), where it is the required
# check. Day-to-day PRs into develop get the backend-only job
# (backend-tests.yml); run the full suite locally before opening one.
on:
  push:
    tags:
      - 'v*-rc*'
  pull_request:
    branches: [main]
  release:
    types: [prereleased, published]
  workflow_dispatch:

# Least privilege: the suite only ever needs to read the checked-out tree.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Full suite (pytest + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the test suite
        # docker-compose.test.yml builds the backend-e2e-deps image, starts an
        # ephemeral PostgreSQL, and runs backend/run_tests.sh, which brings up
        # uvicorn (:8000) and Vite (:5173) before invoking pytest. The whole
        # suite — unit, integration and Playwright e2e — runs in one command.
        run: docker compose -f docker-compose.test.yml run --rm test

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
