[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# e2e tests require live servers — excluded from the default run
addopts = "--ignore=tests/test_e2e_auth.py --ignore=tests/test_e2e_shell.py --ignore=tests/test_e2e_sessions.py --ignore=tests/test_e2e_members.py"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
