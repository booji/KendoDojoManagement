[project]
name = "kendodojomanagement"
# Not published as a package: the image tag is the version (ADR-0004).
version = "0.0.0"
license = "AGPL-3.0-or-later"
# The image's Python (Dockerfile `FROM python:3.13-slim`). A new minor is an
# upgrade done by hand, not a bump (see .github/dependabot.yml).
requires-python = "==3.13.*"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    # [asyncio] pulls greenlet, which async SQLAlchemy needs at runtime. Without
    # the extra it is only present via the dev group, so the prod image crashes
    # on the first async connection (`alembic upgrade head` in entrypoint.sh).
    "sqlalchemy[asyncio]==2.1.6",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "bcrypt>=5.0.0",
    "webauthn==3.0.1",
    "python-dotenv==1.2.4",
    "pydantic[email]==2.14.2",
    "typer>=0.27.3",
    "slowapi>=0.1.10",
    "python-multipart==0.0.32",
    # Bundles a dated snapshot of the Public Suffix List for offline, no-network
    # lookups at startup (issue #309). The snapshot ages with this pin — refresh
    # it by bumping the version, not by letting the library fetch updates itself.
    "publicsuffixlist==1.1.2.20261029",
    # Security floors on transitive dependencies (issue #235). uv.lock already
    # pins exact versions; these stop a re-lock from resolving below the
    # CVE-fixed release. webauthn 3.0.0 requires cryptography>=50.0.2, which
    # clears GHSA-537c-gmf6-5ccf (issue #241).
    "cryptography>=50.0.2",
    "urllib3>=2.8.0",
    "idna>=3.20",
    "click>=8.5.0",
    "Mako>=1.4.3",
    "pyasn1>=0.6.5",
    "markdown-it-py>=4.2.0",
]

[dependency-groups]
# `uv sync` installs dev by default; docs only on request (--group docs).
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "freezegun==1.5.5",
    "pytest-playwright>=0.10.0",
    "httpx==0.28.1",
    "requests>=2.34.2",
    "ruff==0.17.3",
    "greenlet>=3.5.6",
    "playwright>=1.64.1",
    "ty==0.0.107",
]
# The docs site (mkdocs.yml, .github/workflows/docs.yml). Pinned like the
# backend: a theme release must not change the site unreviewed.
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.8.0",
    "mike==2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Wall-clock convergence assertions (issues #298, #364). They measure real
    # latency, so unlike the synthetic fixtures in test_timing_convergence.py
    # their outcome depends on the machine underneath them. The per-push CI job
    # reports them without gating on them -- see .github/workflows/backend-tests.yml
    # and docs/auth-timing-calibration.md.
    "timing_sensitive: asserts on measured wall-clock latency",
    # e2e tests that exercise the guided tour (#609); every other browser test
    # starts with it marked as seen (conftest.py).
    "tour: lets the guided tour start on first sign-in",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# anyio ships a pytest plugin (it arrives transitively via httpx/starlette) that
# claims any test carrying @pytest.mark.anyio and runs it in an event loop of
# its own making. That loop is not the function-scoped loop pytest-asyncio
# builds for async fixtures, so a test combining the two gets a connection
# created on one loop and awaited on another:
#
#   RuntimeError: Task ... got Future ... attached to a different loop
#
# which is exactly how the two db_session-backed tests in test_erasure.py
# failed deterministically (#282). asyncio_mode = "auto" already drives every
# async test through pytest-asyncio, so the anyio plugin is redundant as well
# as harmful — disable it and let one plugin own the loop.
#
# -rX names every xpassing test in the summary. A non-strict xfail that starts
# passing is otherwise reported only as a bare "N xpassed" count, so a stub
# whose behaviour has landed — or one that never asserted anything and passes
# vacuously — sits in the suite indefinitely with no way to tell which test it
# was without a separate run (#283). Naming them makes the drift visible in
# the run that introduces it.
addopts = "-p no:anyio -rX"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "E402", "F841"]
"alembic/**" = ["E501"]
