# Production stack (app + PostgreSQL). App settings come from kendo-app.env
# next to this one; .env holds only what this file interpolates (the image pin,
# the db's settings) and the secrets, which reach the containers as the files in
# ./secrets — run ./setup.sh, which writes all three, before `up` (#603). For the Podman/Quadlet + Traefik deployment
# instead, see deploy/ and docs/deployment.md.
# Explicit project name so the prod, dev and test stacks never share
# containers, networks or volumes. Without it Compose falls back to the
# directory name and all three collide — see #274.
name: kendodojo

# Container hardening (#458), merged into app, migrate and proxy below and
# mirroring deploy/quadlet. Assume one of them is breached: a read-only root
# means no tools written into the image (/tmp is the only scratch space;
# volumes stay writable); no capabilities (proxy adds one back) and no setuid
# escalation; pid and memory caps so it cannot exhaust the host. To tune a
# limit, override it on the service — keys set there win over the merge.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 512m

# Two networks, mirroring the Quadlet deployment in deploy/quadlet
# (kendo-edge + kendo-backend) — see #278. `app` straddles both; `db` is on the
# internal one only, so it has no outbound route and a compromised postgres
# cannot call home.
services:
  app:
    <<: *hardening
    # Back after a crash or an OOM kill at mem_limit; after a reboot, only once
    # podman-restart.service is enabled — `./setup.sh` enables it, check verifies (#582).
    # `always`, not `unless-stopped`: an older Podman's podman-restart.service
    # starts only `always` containers at boot. Same on proxy and db.
    restart: always
    # Published Release image, pinned by its Release line (ADR-0004, ADR-0009):
    # `:0.1` means fixes and features but no Breaking change. Override
    # KENDO_IMAGE in .env to move the pin deliberately, or to run an image you
    # built yourself (`make build` produces localhost/kendodojo:latest).
    image: ${KENDO_IMAGE:-ghcr.io/booji/kendodojomanagement:0.1}
    networks:
      - edge
      - backend
    # Every app setting comes from kendo-app.env, which ./setup.sh writes from
    # deploy/env/kendo-app.env.example, the file the Quadlet unit reads too
    # (#603). A key added there reaches the app with no change here. It holds
    # no secret and no superuser login: those stay in .env, which only this
    # file reads, so .env as a whole never reaches the app (ADR-0007).
    env_file: kendo-app.env
    environment:
      # Secrets are files mounted from ./secrets (see `secrets:` below), named
      # here by <NAME>_FILE — never values in the environment (#462).
      # DATABASE_URL is the restricted app user's login (ADR-0007), never the
      # superuser's: the app refuses to start as a superuser, and
      # migration_database_url is given to `migrate` alone so its password
      # never reaches this container. SETUP_TOKEN gates claiming the first admin
      # account (ADR-0003), required whether or not the instance is claimed.
      DATABASE_URL_FILE: /run/secrets/database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SETUP_TOKEN_FILE: /run/secrets/setup_token
      # Upload targets, backed by the static_uploads volume below. Set here,
      # over kendo-app.env, so an edit there cannot move them: the paths must
      # match the volume mount, and they live outside /app/static so they
      # cannot shadow the built SPA.
      STATIC_DIR: /app/uploads/logos
      STATIC_BACKGROUNDS_DIR: /app/uploads/backgrounds
    secrets:
      - database_url
      - jwt_secret
      - setup_token
    volumes:
      - static_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # `alembic upgrade head`, then exit. Its own service rather than a step in the
  # app's entrypoint (#391): the app is not started until the schema is ready,
  # and a failed migration fails as this service instead of looking like an app
  # crash. Backend network only — it talks to the db and nothing else.
  #
  # It migrates as the superuser (MIGRATION_DATABASE_URL), then creates or
  # updates the app user named in DATABASE_URL and re-applies its grants, every
  # run (ADR-0007).
  #
  # `service_completed_successfully` is understood by both podman-compose and
  # docker compose. The migration window itself is unchanged; removing it would
  # need two app instances plus an advisory lock in app/db/bootstrap.py.
  migrate:
    <<: *hardening
    # Same image as `app` — the migration chain and the code that runs against
    # it must come from one artefact.
    image: ${KENDO_IMAGE:-ghcr.io/booji/kendodojomanagement:0.1}
    networks:
      - backend
    # The app's settings too, as kendo-migrate.container has them: one image,
    # one configuration.
    env_file: kendo-app.env
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets:
      - database_url
      - migration_database_url
    entrypoint: ["python", "-m", "app.db.bootstrap"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # Traefik terminates TLS and is the only way into the app. Copy both
  # deploy/traefik/selfhost/*.example files to their un-suffixed names and edit
  # the Host() rule and the ACME email BEFORE `up` — the copies are gitignored
  # so an upgrade cannot revert them, and the bind mounts below will otherwise
  # create empty directories where Traefik expects its config.
  proxy:
    <<: *hardening
    restart: always
    image: docker.io/library/traefik:v3.3
    # The one capability back: binding 80/443 inside its own namespace.
    cap_add:
      - NET_BIND_SERVICE
    # Edge only — never the network the database is on, as in deploy/quadlet.
    networks:
      - edge
    # Rootless Podman needs net.ipv4.ip_unprivileged_port_start=80 to bind
    # these: `./setup.sh check` prints the one-liner. Or publish 8080/8443 and
    # add the firewalld redirect (docs/deployment.md §1.2).
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/traefik/selfhost/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./deploy/traefik/selfhost/dynamic:/etc/traefik/dynamic:ro
      - traefik_acme:/acme
      # No container runtime socket: the file provider needs none, and the
      # label provider's socket mount is what deploy/quadlet deliberately
      # avoids.
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    restart: always
    # Backend network only: no published ports and no outbound route.
    networks:
      - backend
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

# isolate=true is what enforces the split: Podman's bridge networks are
# otherwise mutually routable by IP, so a container on one network reaches the
# db's address directly even though it cannot resolve the name. Verified on
# podman 5.6.0. Docker isolates user-defined bridges natively and does not need
# this; whether it rejects the unknown option is untested here — drop these
# lines if `docker compose up` errors at network-create time.
networks:
  # Reaches the outside world: `proxy` publishes 80/443 here and forwards to
  # `app`, which itself publishes nothing.
  edge:
    driver_opts:
      isolate: "true"
  # app <-> db only. Deliberately NOT `internal: true`, even though the
  # equivalent kendo-backend.network in deploy/quadlet sets Internal=true:
  # Podman disables DNS on internal networks ("dnsname and internal networks are
  # incompatible", dns_enabled=false), so the service name `db` would stop
  # resolving and the app could not connect. Verified on podman 5.6.0.
  #
  # `db` publishes no ports and is reachable only from `app`, so the loss is
  # limited to the db's outbound route.
  backend:
    driver_opts:
      isolate: "true"

# Mounted read-only at /run/secrets/<name> in the services that list them, so
# no secret sits in a container's environment (#462). ./setup.sh writes these
# files from .env, on every run and on `./setup.sh upgrade`; edit .env and
# re-run it rather than editing them. The directory is 0700 and the files
# 0644: a file-backed secret is a bind mount that keeps its host mode, and the
# app's uid 1001 is not the host user who owns it.
secrets:
  database_url:
    file: ./secrets/database_url
  migration_database_url:
    file: ./secrets/migration_database_url
  jwt_secret:
    file: ./secrets/jwt_secret
  setup_token:
    file: ./secrets/setup_token

volumes:
  postgres_data:
  # Let's Encrypt account key and issued certificates. Without it every restart
  # re-issues and walks into the ACME rate limit.
  traefik_acme:
  # Uploaded logos and backgrounds. Without this they land on the container
  # filesystem and are lost on every restart or image rebuild.
  static_uploads:
