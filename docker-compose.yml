# Production stack (app + PostgreSQL). Config comes from a .env file next to
# this one — copy .env.example to .env and fill it in before `up`. For the
# Podman/Quadlet + Traefik deployment instead, see deploy/ and docs/deployment.md.
# Explicit project name so the prod, dev and test stacks never share
# containers, networks or volumes. Without it Compose falls back to the
# directory name and all three collide — see #274.
name: kendodojo

# Two networks, mirroring the Quadlet deployment in deploy/quadlet
# (kendo-edge + kendo-backend) — see #278. `app` straddles both; `db` is on the
# internal one only, so it has no outbound route and a compromised postgres
# cannot call home.
services:
  app:
    build: .
    networks:
      - edge
      - backend
    ports:
      - "8000:8000"
    environment:
      TZ: ${TZ:-UTC}
      # This is the production stack, so production is the default rather than
      # something an operator has to remember to opt into. It switches on the
      # startup checks that refuse to boot with the localhost WEBAUTHN_*
      # defaults still in place — a misconfiguration that otherwise produces a
      # healthy-looking deploy that rejects every passkey ceremony.
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-15}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Passkeys are bound to the public domain: WEBAUTHN_RP_ID is the bare
      # host, WEBAUTHN_ORIGIN the full scheme+host the browser sees. Wrong
      # values mean registration and login ceremonies are rejected.
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
      WEBAUTHN_CHALLENGE_TTL_SECONDS: ${WEBAUTHN_CHALLENGE_TTL_SECONDS:-300}
      # Keep pinned to the single canonical origin — never "*" (auth is
      # cookie-based). Defaults to WEBAUTHN_ORIGIN inside the app if empty.
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Minimum wall-clock time (ms) the passkey begin endpoints take,
      # regardless of whether the email is known or not — closes a timing
      # side channel that would otherwise enumerate registered emails. Only
      # masks it while the real path finishes underneath it. 100ms is measured
      # against PostgreSQL (real-path p99 16.8ms, worst observed 27.9ms) plus
      # headroom for slower storage — see docs/auth-timing-calibration.md.
      AUTH_BEGIN_MIN_DURATION_MS: ${AUTH_BEGIN_MIN_DURATION_MS:-100}
      # Only set true when a trusted reverse proxy in front of this stack
      # overwrites X-Forwarded-For; otherwise clients can spoof their IP and
      # evade rate limiting and lockout. The published port below is direct,
      # so the safe default is false.
      TRUST_PROXY_XFF: ${TRUST_PROXY_XFF:-false}
      # Upload targets, backed by the static_uploads volume below. Deliberately
      # not configurable via .env: the paths must match the volume mount, and
      # they live outside /app/static so they cannot shadow the built SPA.
      STATIC_DIR: /app/uploads/logos
      STATIC_BACKGROUNDS_DIR: /app/uploads/backgrounds
    volumes:
      - static_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    # Backend network only: no published ports and no outbound route.
    networks:
      - backend
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

# isolate=true is what enforces the split: Podman's bridge networks are
# otherwise mutually routable by IP, so a container on one network reaches the
# db's address directly even though it cannot resolve the name. Verified on
# podman 5.6.0. Docker isolates user-defined bridges natively and does not need
# this; whether it rejects the unknown option is untested here — drop these
# lines if `docker compose up` errors at network-create time.
networks:
  # Reaches the outside world: `app` publishes 8000 here, and needs outbound for
  # anything it fetches. A reverse proxy in front of the stack joins this one.
  edge:
    driver_opts:
      isolate: "true"
  # app <-> db only. Deliberately NOT `internal: true`, even though the
  # equivalent kendo-backend.network in deploy/quadlet sets Internal=true:
  # Podman disables DNS on internal networks ("dnsname and internal networks are
  # incompatible", dns_enabled=false), so the service name `db` would stop
  # resolving and the app could not connect. Verified on podman 5.6.0.
  #
  # `db` publishes no ports and is reachable only from `app`, so the loss is
  # limited to the db's outbound route.
  backend:
    driver_opts:
      isolate: "true"

volumes:
  postgres_data:
  # Uploaded logos and backgrounds. Without this they land on the container
  # filesystem and are lost on every restart or image rebuild.
  static_uploads:
