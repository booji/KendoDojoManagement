# Traefik STATIC config for the hardened deployment. `setup.sh --quadlet` writes
# ~/kendo/traefik/traefik.yml from this file; by hand, copy it there and edit the
# ACME email. Mounted read-only into the container.

entryPoints:
  web:
    address: ":80"
    # Redirect all plain HTTP to HTTPS.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  # File provider: routers/services/middlewares live in ./dynamic/*.yml.
  # We deliberately do NOT use the podman socket provider — no socket is mounted
  # into Traefik, keeping its blast radius minimal.
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: you@example.com            # <-- EDIT
      storage: /acme/acme.json
      # ACME CHALLENGE — setup.sh --quadlet (#412) reads THIS file and replaces
      # this line and everything below it in this block. Editing your own
      # ~/kendo/traefik/traefik.yml by hand is fine; a later run regenerates it
      # from here and keeps your version as traefik.yml.bak. Keep the marker.
      #
      # HTTP-01: the host must be publicly reachable on port 80. Behind a
      # firewall use TLS-ALPN-01 (inbound 443 only, `tlsChallenge: {}`) or
      # DNS-01 — which also needs the provider's credentials as a drop-in on
      # kendo-traefik.container, see deploy/quadlet/kendo-traefik.container.
      httpChallenge:
        entryPoint: web

api:
  dashboard: false          # never expose the dashboard
log:
  level: INFO
