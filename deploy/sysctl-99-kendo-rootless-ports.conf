# Allow rootless containers to bind low ports (Traefik needs 80/443).
# Install as root: copy to /etc/sysctl.d/99-kendo-rootless-ports.conf then
#     sudo sysctl --system
#
# Trade-off: any unprivileged process on this host may now bind ports >= 80.
# Acceptable on a single-purpose appliance. Hardened alternative (firewalld
# redirect) is documented in docs/deployment.md.
net.ipv4.ip_unprivileged_port_start=80
